<style>
:root{--vw:1vw;--vh:1vh}
:root{
  color-scheme: light;
  --bg:#f4ead6; --bg2:#efe1c4; --ink:#2a2440; --muted:#6d6581; --card:#fffaf0; --line:#e2d1ad;
  --rest:#e8553e; --rest-soft:#fde3dd; --gql:#cf2f86; --gql-soft:#fbe0ef; --tie:#d99a12; --tie-soft:#fbefcf;
  --gold:#f2b631; --ok:#23915f; --bad:#d64545; --shadow:0 6px 0 rgba(90,60,20,.12), 0 14px 30px rgba(90,60,20,.10);
  --font:'Mitr', 'Noto Sans Thai', system-ui, sans-serif; --mono:'JetBrains Mono', ui-monospace, monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font); color:var(--ink); background:var(--bg); font-weight:400;
  background-image:radial-gradient(circle at 20% 10%, rgba(255,255,255,.55), transparent 40%), radial-gradient(circle at 90% 90%, rgba(242,182,49,.12), transparent 45%);}
button{font-family:inherit; cursor:pointer}
.hidden{display:none !important}
.btn{border:0; border-radius:14px; padding:.7em 1.2em; font-size:1rem; font-weight:500; background:var(--ink); color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.25); transition:transform .08s}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.ghost{background:transparent; color:var(--ink); box-shadow:none; border:2px solid var(--line)}
.warn{background:#fff3cd; border:2px solid #efd27a; color:#6b4e00; border-radius:12px; padding:.5em .8em; font-size:.95em}

/* ---------- landing ---------- */
.landing{min-height:100dvh; display:grid; place-items:center; padding:16px}
.landing .card{background:var(--card); border:2px solid var(--line); border-radius:22px; padding:28px; max-width:520px; width:100%; box-shadow:var(--shadow); text-align:center}
.landing h1{margin:.2em 0; font-size:28px; font-weight:600}
.landing p{color:var(--muted)}
.landing .row{display:flex; gap:10px; margin-top:14px}
.landing input{flex:1; min-width:0; font:inherit; font-size:22px; letter-spacing:.2em; text-transform:uppercase; text-align:center; padding:.5em; border-radius:12px; border:2px solid var(--line); background:#fff}
.crest{font-size:44px}

/* ---------- host ---------- */
body.host{height:calc(var(--vh) * 100); overflow:hidden; display:grid; grid-template-rows:auto 1fr auto}
.topbar{display:flex; align-items:center; gap:calc(var(--vw) * 1.2); padding:calc(var(--vw) * .7) calc(var(--vw) * 1.4)}
.logo{display:flex; align-items:center; gap:calc(var(--vw) * .6)}
.logo .crest{font-size:calc(var(--vw) * 2.4)}
.logo b{font-size:calc(var(--vw) * 1.55); font-weight:600; display:block; line-height:1.1}
.logo span{font-size:calc(var(--vw) * .95); color:var(--muted)}
.progress{display:flex; gap:calc(var(--vw) * .5); margin-left:auto; align-items:center}
.progress i{width:calc(var(--vw) * 2.1); height:calc(var(--vw) * 2.1); border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:calc(var(--vw) * .95); background:var(--bg2); color:var(--muted); border:2px solid var(--line); font-weight:600}
.progress i.on{background:var(--gold); color:var(--ink); border-color:#c98f14; transform:scale(1.12)}
.progress i.done{background:var(--ink); color:#fff; border-color:var(--ink)}
.roombox{display:flex; align-items:center; gap:calc(var(--vw) * .8); background:var(--card); border:2px solid var(--line); border-radius:14px; padding:calc(var(--vw) * .35) calc(var(--vw) * .8)}
.roombox .code{font-size:calc(var(--vw) * 1.5); font-weight:600; letter-spacing:.12em}
.roombox small{display:block; color:var(--muted); font-size:calc(var(--vw) * .75)}
.roombox .mini-qr{width:calc(var(--vw) * 3.6); height:calc(var(--vw) * 3.6); background:#fff; border-radius:6px; padding:3px}
.roombox .mini-qr img,.roombox .mini-qr canvas{width:100% !important; height:100% !important}
.people{font-size:calc(var(--vw) * 1.2); font-weight:500}
.dot{display:inline-block; width:calc(var(--vw) * .7); height:calc(var(--vw) * .7); border-radius:50%; background:#aaa; margin-right:calc(var(--vw) * .3); vertical-align:middle}
.dot.ok{background:var(--ok)} .dot.wait{background:var(--gold)} .dot.local{background:#8a84a0}

.stage{display:grid; grid-template-columns:minmax(300px, calc(var(--vw) * 31)) 1fr; gap:calc(var(--vw) * 1.1); padding:0 calc(var(--vw) * 1.4) calc(var(--vw) * .6); min-height:0}
.panel{background:var(--card); border:2px solid var(--line); border-radius:20px; padding:calc(var(--vw) * 1.3) calc(var(--vw) * 1.4); box-shadow:var(--shadow); overflow:auto; min-height:0; display:flex; flex-direction:column; gap:calc(var(--vw) * .9)}
.panel .kicker{font-size:calc(var(--vw) * .95); color:var(--muted); font-weight:500; letter-spacing:.02em}
.panel h2{margin:0; font-size:calc(var(--vw) * 2); line-height:1.2; font-weight:600}
.panel .need{font-size:calc(var(--vw) * 1.2); line-height:1.45; background:var(--bg2); border-radius:12px; padding:calc(var(--vw) * .7) calc(var(--vw) * .9)}
.netchip{display:inline-flex; gap:calc(var(--vw) * .4); align-items:center; font-size:calc(var(--vw) * .95); background:#e8f1ff; color:#23456e; border-radius:999px; padding:calc(var(--vw) * .2) calc(var(--vw) * .8); align-self:flex-start}
.codes{display:grid; gap:calc(var(--vw) * .6)}
.codebox{border-radius:12px; overflow:hidden; border:2px solid}
.codebox .cap{font-size:calc(var(--vw) * .9); font-weight:600; padding:calc(var(--vw) * .25) calc(var(--vw) * .7); color:#fff}
.codebox pre{margin:0; padding:calc(var(--vw) * .6) calc(var(--vw) * .8); font-family:var(--mono), var(--font); font-size:calc(var(--vw) * .92); line-height:1.45; white-space:pre-wrap; background:#fff}
.codebox.rest{border-color:var(--rest)} .codebox.rest .cap{background:var(--rest)}
.codebox.gql{border-color:var(--gql)} .codebox.gql .cap{background:var(--gql)}
.codebox .note{font-size:calc(var(--vw) * .85); color:var(--muted); padding:0 calc(var(--vw) * .8) calc(var(--vw) * .5); background:#fff}

.hint{font-size:calc(var(--vw) * .9); color:var(--muted)}
.verdict{border-radius:16px; padding:calc(var(--vw) * .9) calc(var(--vw) * 1); color:#fff; font-size:calc(var(--vw) * 1.8); font-weight:600; display:flex; align-items:center; gap:calc(var(--vw) * .7); animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.verdict.rest{background:var(--rest)} .verdict.gql{background:var(--gql)} .verdict.tie{background:var(--tie)}
.verdict small{display:block; font-size:calc(var(--vw) * .95); font-weight:400; opacity:.95}
.dist{display:grid; gap:calc(var(--vw) * .35)}
.dist .row{display:grid; grid-template-columns:calc(var(--vw) * 9) 1fr calc(var(--vw) * 3); align-items:center; gap:calc(var(--vw) * .5); font-size:calc(var(--vw) * 1)}
.dist .bar{height:calc(var(--vw) * 1.3); border-radius:6px; background:var(--bg2); overflow:hidden}
.dist .bar i{display:block; height:100%; width:0; transition:width .9s cubic-bezier(.2,.8,.2,1)}
.dist .row.correct{font-weight:600}
.dist .row.correct span:first-child::after{content:" ✓"; color:var(--ok)}
.lesson h3{margin:0 0 calc(var(--vw) * .3); font-size:calc(var(--vw) * 1.4); font-weight:600}
.lesson p{margin:0; font-size:calc(var(--vw) * 1.1); line-height:1.55}
.extra{background:#eef6ff; border:2px dashed #9cc2ef; border-radius:12px; padding:calc(var(--vw) * .6) calc(var(--vw) * .8); font-size:calc(var(--vw) * 1)}
.legend-list{display:grid; gap:calc(var(--vw) * .6); font-size:calc(var(--vw) * 1.4)}
.legend-list div{display:grid; grid-template-columns:calc(var(--vw) * 2.4) 1fr; gap:calc(var(--vw) * .5); align-items:start; line-height:1.4}
.legend-list b{font-weight:600}
.legend-list .ic{font-size:calc(var(--vw) * 1.5)}

.arena{display:grid; grid-template-rows:1fr 1fr; gap:calc(var(--vw) * .9); min-height:0}
.lane{position:relative; border-radius:20px; overflow:hidden; display:flex; flex-direction:column; min-height:0; background:#fff; border:3px solid; box-shadow:var(--shadow)}
.lane.rest{border-color:var(--rest)} .lane.gql{border-color:var(--gql)}
.lane-head{display:flex; align-items:center; gap:calc(var(--vw) * .7); padding:calc(var(--vw) * .35) calc(var(--vw) * .8); color:#fff; flex-wrap:wrap}
.lane.rest .lane-head{background:var(--rest)} .lane.gql .lane-head{background:var(--gql)}
.lane-head .name{font-size:calc(var(--vw) * 1.3); font-weight:600; margin-right:calc(var(--vw) * .4)}
.chips{display:flex; gap:calc(var(--vw) * .45); flex-wrap:wrap}
.chip{display:inline-flex; align-items:baseline; gap:calc(var(--vw) * .3); background:rgba(255,255,255,.95); color:var(--ink); border-radius:10px; padding:calc(var(--vw) * .15) calc(var(--vw) * .6); font-size:calc(var(--vw) * 1.05)}
.chip b{font-weight:600; font-variant-numeric:tabular-nums}
.chip small{font-size:calc(var(--vw) * .75); color:var(--muted)}
.lane canvas{flex:1; width:100%; min-height:0; display:block}
.crown{position:absolute; right:calc(var(--vw) * 1); top:calc(var(--vw) * 3.2); font-size:calc(var(--vw) * 1.6); font-weight:600; background:var(--gold); color:var(--ink); padding:calc(var(--vw) * .3) calc(var(--vw) * .9); border-radius:999px; box-shadow:0 4px 0 rgba(0,0,0,.15); animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.footer{display:flex; justify-content:space-between; padding:0 calc(var(--vw) * 1.4) calc(var(--vw) * .5); font-size:calc(var(--vw) * .8); color:var(--muted)}
.footer .keys kbd{font-family:var(--mono); background:var(--card); border:1px solid var(--line); border-radius:5px; padding:0 calc(var(--vw) * .35); margin:0 calc(var(--vw) * .15)}
.navbtns{display:flex; gap:calc(var(--vw) * .4)}
.navbtns button{font-size:calc(var(--vw) * .85); padding:calc(var(--vw) * .3) calc(var(--vw) * .8); border-radius:8px; border:2px solid var(--line); background:var(--card); color:var(--ink)}

.overlay{position:fixed; inset:0; z-index:20; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:calc(var(--vw) * 3)}
.lobby{display:grid; grid-template-columns:auto 1fr; gap:calc(var(--vw) * 3); width:100%; height:100%; align-items:center}
.lobby .left{display:flex; flex-direction:column; align-items:center; gap:calc(var(--vw) * 1.2); text-align:center}
.lobby h1{font-size:calc(var(--vw) * 3.2); margin:0; font-weight:600; line-height:1.15}
.lobby .sub{font-size:calc(var(--vw) * 1.4); color:var(--muted)}
.qr-big{background:#fff; padding:calc(var(--vw) * 1); border-radius:18px; box-shadow:var(--shadow); width:min(calc(var(--vh) * 40), calc(var(--vw) * 26)); height:min(calc(var(--vh) * 40), calc(var(--vw) * 26))}
.qr-big img,.qr-big canvas{width:100% !important; height:100% !important}
.joinurl{font-family:var(--mono); font-size:calc(var(--vw) * 1); background:var(--card); border:2px solid var(--line); border-radius:10px; padding:calc(var(--vw) * .3) calc(var(--vw) * .8); max-width:calc(var(--vw) * 34); overflow-wrap:anywhere}
.bigcode{font-size:calc(var(--vw) * 4); font-weight:600; letter-spacing:.2em; line-height:1}
.lobby .right{align-self:stretch; display:flex; flex-direction:column; gap:calc(var(--vw) * 1); min-height:0}
.lobby .count{font-size:calc(var(--vw) * 2.2); font-weight:600}
.namecloud{display:flex; flex-wrap:wrap; gap:calc(var(--vw) * .6); align-content:flex-start; overflow:hidden; flex:1}
.namecloud span{background:var(--card); border:2px solid var(--line); border-radius:999px; padding:calc(var(--vw) * .3) calc(var(--vw) * 1); font-size:calc(var(--vw) * 1.4); animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.namecloud span.bot{opacity:.7; border-style:dashed}
.lobby .foot{display:flex; gap:calc(var(--vw) * 1); align-items:center; flex-wrap:wrap}

.board{width:min(calc(var(--vw) * 70), 1100px)}
.board h1{text-align:center; font-size:calc(var(--vw) * 3); margin:0 0 calc(var(--vw) * 1.5); font-weight:600}

.podium{display:flex; align-items:flex-end; justify-content:center; gap:calc(var(--vw) * 1.5); margin-top:calc(var(--vw) * 2)}
.pod{display:flex; flex-direction:column; align-items:center; gap:calc(var(--vw) * .6); width:calc(var(--vw) * 16)}
.pod .nm{font-size:calc(var(--vw) * 1.8); font-weight:600; text-align:center; overflow-wrap:anywhere}
.pod .ps{font-size:calc(var(--vw) * 1.3); color:var(--muted)}
.pod .blk{width:100%; border-radius:16px 16px 0 0; display:grid; place-items:center; font-size:calc(var(--vw) * 4); font-weight:600; color:#fff; box-shadow:var(--shadow); animation:rise .9s cubic-bezier(.2,1.2,.3,1) both}
.pod.p1 .blk{height:calc(var(--vh) * 22); background:linear-gradient(#f7c948,#e0a310)} .pod.p2 .blk{height:calc(var(--vh) * 15); background:linear-gradient(#c9d3e3,#96a3b8)} .pod.p3 .blk{height:calc(var(--vh) * 11); background:linear-gradient(#e7a877,#c47b41)}
.rest-list{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:calc(var(--vw) * .4) calc(var(--vw) * 2); margin-top:calc(var(--vw) * 2); width:min(calc(var(--vw) * 60),900px); font-size:calc(var(--vw) * 1.3)}
.rest-list div{display:flex; justify-content:space-between; border-bottom:1px dashed var(--line); padding:calc(var(--vw) * .2) 0}

#confetti{position:fixed; inset:0; pointer-events:none; z-index:30}

@keyframes pop{0%{transform:scale(.6); opacity:0} 100%{transform:scale(1); opacity:1}}

@keyframes rise{0%{transform:scaleY(0); transform-origin:bottom} 100%{transform:scaleY(1); transform-origin:bottom}}

/* ---------- player (phone) ---------- */
body.player{min-height:100dvh; display:flex; flex-direction:column; padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.p-top{display:flex; justify-content:space-between; align-items:center; font-size:14px; color:var(--muted); gap:8px}
.p-top .me{font-weight:500; color:var(--ink); background:var(--card); border:2px solid var(--line); border-radius:999px; padding:4px 12px; max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.p-main{flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px; padding:10px 0}
.p-card{background:var(--card); border:2px solid var(--line); border-radius:22px; padding:20px; box-shadow:var(--shadow); text-align:center}
.p-card h2{margin:.2em 0; font-size:24px; font-weight:600; line-height:1.3}
.p-card p{margin:.4em 0; color:var(--muted); font-size:16px; line-height:1.5}
.p-big{font-size:56px; line-height:1}
.p-input{width:100%; font:inherit; font-size:22px; padding:14px; border-radius:14px; border:2px solid var(--line); background:#fff; text-align:center; margin:12px 0}
.p-go{width:100%; font-size:22px; padding:16px; border-radius:16px}
.choices{display:grid; gap:12px}
.choice{border:0; border-radius:20px; padding:22px 16px; font-size:26px; font-weight:600; color:#fff; display:flex; align-items:center; gap:14px; box-shadow:0 6px 0 rgba(0,0,0,.2); text-align:left}
.choice:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.2)}
.choice small{display:block; font-size:14px; font-weight:400; opacity:.95}
.choice .ic{font-size:34px}
.choice.rest{background:var(--rest)} .choice.gql{background:var(--gql)} .choice.tie{background:var(--tie)}

.p-res.ok{background:#e3f6ec; border-color:#8fd3b0} .p-res.bad{background:#fde7e7; border-color:#efa3a3}
.p-score{font-size:40px; font-weight:600}
.p-rank{font-size:18px}
.p-foot{font-size:12px; color:var(--muted); text-align:center}

/* =====================================================================
   STARDEW SKIN v2  (ชุดสีเดียวกับสไลด์: กรอบไม้ 5 ชั้น, กล่อง 3 ชั้น)
   ===================================================================== */
:root{
  --night:#1b1830; --ink:#3a1e17; --muted:#853605;
  --panel:#efa95f; --card:#ffd68a; --slot:#ffe4b3; --hi:#fff3d1;
  --bg2:#ffd68a; --line:#d68f54;
  --rest:#d63c2a; --rest-soft:#f7c3b6; --gql:#8a3fb0; --gql-soft:#dcc3ea; --tie:#c98a12; --tie-soft:#ffe4b3;
  --gold:#ffc53d; --ok:#3f9b3a; --bad:#d64545;
  --shadow:none;
  --pix:'TA 16 Bit', 'Mitr', 'Noto Sans Thai', system-ui, sans-serif;
  --wood: 0 0 0 calc(var(--vw) * .18) #d68f54, 0 0 0 calc(var(--vw) * .36) #853605, 0 0 0 calc(var(--vw) * .54) #dc7b05, 0 0 0 calc(var(--vw) * .72) #b14e05, 0 0 0 calc(var(--vw) * .9) #5b2b2a, calc(var(--vw) * .5) calc(var(--vw) * .5) 0 calc(var(--vw) * .9) rgba(0,0,0,.45);
  --wood-px: 0 0 0 3px #d68f54, 0 0 0 6px #853605, 0 0 0 9px #dc7b05, 0 0 0 12px #b14e05, 0 0 0 15px #5b2b2a, 8px 8px 0 15px rgba(0,0,0,.45);
  --raised: inset calc(var(--vw) * .16) calc(var(--vw) * .16) 0 #fff3d1, inset calc(var(--vw) * -.16) calc(var(--vw) * -.16) 0 #d69a55, 0 0 0 calc(var(--vw) * .16) #853605;
  --raised-px: inset 2px 2px 0 #fff3d1, inset -2px -2px 0 #d69a55, 0 0 0 2px #853605;
  --inset: inset calc(var(--vw) * .2) calc(var(--vw) * .2) 0 #c47a3c, inset calc(var(--vw) * -.14) calc(var(--vw) * -.14) 0 #fff3d1, 0 0 0 calc(var(--vw) * .14) #853605;
  --inset-px: inset 3px 3px 0 #c47a3c, inset -2px -2px 0 #fff3d1, 0 0 0 2px #853605;
}
*,*::before,*::after{border-radius:0 !important}
html{background:var(--night)}
body{background:var(--night) var(--bg-spring) center/cover no-repeat fixed; image-rendering:pixelated}
html[data-season="summer"] body{background-image:var(--bg-summer)}
html[data-season="fall"] body{background-image:var(--bg-fall)}
html[data-season="winter"] body{background-image:var(--bg-winter)}

h1,h2,h3,.logo b,.bigcode,.roombox .code,.lane-head .name,.verdict,.progress i,.lobby .count,.pod .blk,.pod .nm,.p-score,.p-card h2,.crown,.chip b,.btn,.choice{font-family:var(--pix)}

/* ---------- ไอคอน pixel ---------- */
.pxi{display:inline-block; width:1.15em; height:1.15em; vertical-align:-.2em; background:center/contain no-repeat; image-rendering:pixelated; font-style:normal}

/* ---------- ปุ่ม ---------- */
.btn{background:#b14e05; color:#fff3d1; border:3px solid #5b2b2a; box-shadow:inset 0 3px 0 #dc7b05, 0 4px 0 #2b1410}
.btn:active{transform:translateY(3px); box-shadow:inset 0 3px 0 #dc7b05, 0 1px 0 #2b1410}
.btn.ghost{background:var(--card); color:var(--ink); border:3px solid #853605; box-shadow:inset 0 3px 0 #fff3d1, 0 4px 0 #2b1410}
.warn{background:var(--slot); border:0; box-shadow:var(--raised); color:var(--ink)}

/* ---------- landing ---------- */
.landing .card{border:0; box-shadow:var(--wood-px); background:var(--panel)}
.landing p{color:var(--muted)}
.landing input{border:0; box-shadow:var(--inset-px); background:var(--slot)}

/* ---------- host: แถบบนเป็นป้ายไม้ลอยบนฉาก ---------- */
.topbar{padding:calc(var(--vw) * 1.3) calc(var(--vw) * 2) calc(var(--vw) * 1); gap:calc(var(--vw) * 1.6)}
.logo{background:var(--panel); box-shadow:var(--wood); padding:calc(var(--vw) * .35) calc(var(--vw) * .9)}
.logo b{color:var(--ink)} .logo span{color:var(--muted); font-size:calc(var(--vw) * 1.05)}
.people{background:var(--panel); box-shadow:var(--wood); padding:calc(var(--vw) * .45) calc(var(--vw) * .9); color:var(--ink); font-size:calc(var(--vw) * 1.3)}
.progress i{width:calc(var(--vw) * 2.4); height:calc(var(--vw) * 2.4); font-size:calc(var(--vw) * 1.2); background:var(--slot); color:var(--ink); border:0; box-shadow:var(--inset)}
.progress i.on{background:var(--gold); box-shadow:var(--raised); transform:scale(1.12)}
.progress i.done{background:#853605; color:var(--hi); box-shadow:0 0 0 calc(var(--vw) * .14) #5b2b2a}
.roombox{border:0; background:var(--panel); box-shadow:var(--wood)}
.roombox small{font-size:calc(var(--vw) * .95); color:var(--muted)}
.dot.ok{background:var(--ok)} .dot.wait{background:var(--gold)} .dot.local{background:#8a84a0}
.stage{gap:calc(var(--vw) * 2.4); padding:calc(var(--vw) * 1.2) calc(var(--vw) * 2) calc(var(--vw) * 1.6)}
.panel{border:0; box-shadow:var(--wood); background:var(--panel); overflow:hidden; display:block; padding:calc(var(--vw) * 1.3) calc(var(--vw) * 1.4)}
.pin{display:flex; flex-direction:column; gap:calc(var(--vw) * .9); min-height:100%}
.panel .kicker{font-size:calc(var(--vw) * 1.15); color:var(--muted)}
.panel h2{color:var(--ink)}
.panel .need{background:var(--card); box-shadow:var(--raised); font-size:calc(var(--vw) * 1.25)}
.netchip{background:var(--slot); color:var(--ink); border:0; box-shadow:var(--inset); font-size:calc(var(--vw) * 1.1); padding:calc(var(--vw) * .25) calc(var(--vw) * .8)}
.codebox{border:0; box-shadow:0 0 0 calc(var(--vw) * .16) #5b2b2a}
.codebox .cap{font-size:calc(var(--vw) * 1.05)}
.codebox pre{background:#2e1a16; color:#ffe4b3; font-size:calc(var(--vw) * 1)}
.codebox .note{background:var(--slot); color:var(--ink); font-size:calc(var(--vw) * 1); padding:calc(var(--vw) * .4) calc(var(--vw) * .8)}

.hint{font-size:calc(var(--vw) * 1.05); color:var(--muted)}
.verdict{border:calc(var(--vw) * .18) solid #2b1410; box-shadow:calc(var(--vw) * .35) calc(var(--vw) * .35) 0 rgba(0,0,0,.35)}
.verdict small{font-size:calc(var(--vw) * 1.1)}
.dist .row{font-size:calc(var(--vw) * 1.15); grid-template-columns:calc(var(--vw) * 10) 1fr calc(var(--vw) * 3)}
.dist .bar{background:var(--slot); box-shadow:var(--inset); height:calc(var(--vw) * 1.4)}
.dist .bar i{transition-timing-function:steps(8,end)}
.lesson h3{font-size:calc(var(--vw) * 1.45)}
.lesson p{font-size:calc(var(--vw) * 1.15)}
.extra{background:var(--card); border:calc(var(--vw) * .14) dashed #853605; font-size:calc(var(--vw) * 1.05)}
.legend-list{font-size:calc(var(--vw) * 1.4)}
.legend-list div{background:var(--card); box-shadow:var(--raised); padding:calc(var(--vw) * .35) calc(var(--vw) * .5)}
.arena{gap:calc(var(--vw) * 2.4)}
.lane{border:0; box-shadow:var(--wood); background:#8fd3f5}
.lane canvas{image-rendering:pixelated; image-rendering:crisp-edges}
.lane-head{background:#853605; box-shadow:inset 0 calc(var(--vw) * -.2) 0 #5b2b2a, inset 0 calc(var(--vw) * .16) 0 #b14e05; padding:calc(var(--vw) * .4) calc(var(--vw) * .8)}
.lane.rest .lane-head,.lane.gql .lane-head{background:#853605}
.lane-head .name{color:#fff; padding:calc(var(--vw) * .1) calc(var(--vw) * .7); box-shadow:0 0 0 calc(var(--vw) * .14) #2b1410; font-size:calc(var(--vw) * 1.35)}
.lane.rest .lane-head .name{background:var(--rest)} .lane.gql .lane-head .name{background:var(--gql)}
.chip{background:var(--slot); color:var(--ink); border:0; box-shadow:var(--inset); font-size:calc(var(--vw) * 1.15); padding:calc(var(--vw) * .15) calc(var(--vw) * .6)}
.chip small{font-size:calc(var(--vw) * .95); color:var(--muted)}
.crown{background:var(--gold); color:var(--ink); box-shadow:0 0 0 calc(var(--vw) * .16) #5b2b2a, calc(var(--vw) * .3) calc(var(--vw) * .3) 0 calc(var(--vw) * .16) rgba(0,0,0,.4); top:calc(var(--vw) * 3.6)}
.footer{color:var(--hi); padding:0 calc(var(--vw) * 2) calc(var(--vw) * .6); font-size:calc(var(--vw) * 1); text-shadow:0 2px 0 #000}
.footer .keys kbd{background:var(--slot); color:var(--ink); border:0; box-shadow:var(--inset-px); text-shadow:none}
.navbtns button{background:var(--card); color:var(--ink); border:0; box-shadow:var(--raised-px), 0 3px 0 2px #2b1410; font-size:calc(var(--vw) * 1)}

/* ---------- overlay ---------- */
.overlay{background:var(--night) var(--bg-spring) center/cover no-repeat}
html[data-season="summer"] .overlay{background-image:var(--bg-summer)}
html[data-season="fall"] .overlay{background-image:var(--bg-fall)}
html[data-season="winter"] .overlay{background-image:var(--bg-winter)}
.lobby,.board{background:var(--panel); box-shadow:var(--wood); padding:calc(var(--vw) * 2) calc(var(--vw) * 2.4)}
.lobby{height:auto; max-height:100%}
.lobby .sub{color:var(--muted)}
.qr-big{box-shadow:0 0 0 calc(var(--vw) * .4) #5b2b2a, calc(var(--vw) * .5) calc(var(--vw) * .5) 0 calc(var(--vw) * .4) rgba(0,0,0,.4)}
.joinurl{background:var(--slot); border:0; box-shadow:var(--inset)}
.namecloud span{background:var(--card); border:0; box-shadow:var(--raised); cursor:pointer}

.pod.p1 .blk{background:#e8b52a} .pod.p2 .blk{background:#9fadc2} .pod.p3 .blk{background:#c9803f}

.rest-list div{border-bottom:2px dashed #853605}
.verdict,.crown,.namecloud span{animation-timing-function:steps(5,end) !important}
.pod .blk{animation-timing-function:steps(6,end) !important}

/* ---------- player (มือถือ) ---------- */
body.player{padding:24px 24px calc(24px + env(safe-area-inset-bottom))}
.p-top{color:var(--hi); text-shadow:0 2px 0 #000}
.p-top > span:first-child{background:var(--panel); color:var(--ink); padding:4px 10px; box-shadow:var(--raised-px); text-shadow:none}
.p-top .me{background:var(--slot); border:0; box-shadow:var(--inset-px); text-shadow:none}
.p-card{border:0; box-shadow:var(--wood-px); background:var(--panel)}
.p-card p{color:var(--muted)}
.p-input{border:0; box-shadow:var(--inset-px); background:var(--slot)}
.choice{border:3px solid #2b1410; box-shadow:inset 0 3px 0 rgba(255,255,255,.3), 0 6px 0 #2b1410}
.choice:active{box-shadow:inset 0 3px 0 rgba(255,255,255,.3), 0 2px 0 #2b1410}
 
.p-res.ok{background:#b9dc8a} .p-res.bad{background:#f2b3a3}

:root{
  --u:3px; /* 1 pixel ของ UI (JS ตั้งตามความกว้างจอ: 1920 = 3px) */
  --pix:'PixPlus','PixDigits','TA 16 Bit','Mitr','Noto Sans Thai',system-ui,sans-serif;
  --label:'PixPlus','PixDigits','TA8','Mitr','Noto Sans Thai',sans-serif;
  --frame:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAtklEQVR4nGNkgIJoba3/DESApVevMTIwMDCwwDSFKd8mRh8DA4PW/6VXrzGyRGtr/dfivs3g6UqctisvbjNEa2v9Z4EJbN9NpIVQwILM0dZlYFiJw4BwVwaGq5dxaISBwEh/FP765Rsx1DDhcopW4RpGrcI1jLjkcWokBLA6lYGBgeFafwjeeMWqEZuf8Gq8epmBQUcCu0LkEEXRSHQCWAyhGRkYSEtyq+6qMiy9eo0RHtykJnIALYUylrcFVm8AAAAASUVORK5CYII=);
  font-synthesis-weight:none;
}
.nw{white-space:nowrap}

/* #3 ฟอนต์ผสม: หัวข้อ TA 16 Bit / ป้ายสั้น TA 8 Bit / ย่อหน้ายาว Mitr + เงา */
body.host .netchip,body.host .chip,body.host .legend-list div,body.host .dist .row,body.host .hint,body.host .footer,body.host .roombox small,body.host .people,body.host .logo span,body.host .namecloud span,body.host .rest-list,body.host .pod .ps,body.host .lobby .sub,body.host .warn,body.host .codebox .note,body.host .lobby .count{font-family:var(--label);font-weight:normal}
body.host .legend-list b{font-family:var(--pix);font-weight:normal}

/* #4 ขนาดเป็นจำนวนเต็มของ pixel */
body.host .pxi{width:calc(var(--t)*32/3);height:calc(var(--t)*32/3);vertical-align:calc(var(--t)*-3)}
body.host .lane-head .name .pxi,body.host .crown .pxi{width:calc(var(--t)*32/3);height:calc(var(--t)*32/3);vertical-align:calc(var(--t)*-3)}
body.host .verdict .pxi,body.host .legend-list .ic .pxi,body.host .logo .pxi{width:calc(var(--t)*16);height:calc(var(--t)*16);vertical-align:calc(var(--t)*-5)}
body.host .logo .crest .pxi,body.host .board h1 .pxi{width:calc(var(--t)*16);height:calc(var(--t)*16)}
body.host .legend-list div{grid-template-columns:calc(var(--t)*18) 1fr;align-items:center}
body.player .pxi{width:32px;height:32px;vertical-align:-8px} body.player .p-big .pxi,body.player .choice .ic .pxi{width:48px;height:48px;vertical-align:middle}
body.host .panel h2,body.host .logo b,body.host .lane-head .name,body.host .roombox .code{font-size:calc(var(--t)*32/3)}
body.host .chip b{font-size:calc(var(--t)*8)}
.lane-head{flex-wrap:nowrap} .lane-head .name{white-space:nowrap;flex:none} .chips{flex-wrap:nowrap;gap:calc(var(--t)*2)}
body.host .chip{padding:calc(var(--t)*2/3) calc(var(--t)*2)} body.host .chip small{font-size:calc(var(--t)*14/3)}

/* #5 เงาตัวหนังสือแบบ Stardew */
.panel h2,.lesson h3,.board h1,.sign h1{text-shadow:var(--u) var(--u) 0 #c17c3c}
.panel .need,.lesson p,.dist .row,.hint,.extra,.legend-list div,.namecloud span,.lobby .sub,.lobby .count,.pod .nm,.pod .ps,.rest-list{text-shadow:calc(var(--u)*2/3) calc(var(--u)*2/3) 0 rgba(193,124,60,.6)}

/* #7 กรอบไม้ 9-slice + เงาแข็ง (แทน box-shadow 5 ชั้น) */
.logo,.hud,.panel,.lane,.board,.sign,.lobby .left,.lobby .right{
  box-shadow:none!important;border:calc(var(--u)*6) solid transparent;border-image:var(--frame) 6 / calc(var(--u)*6) stretch;
  background-clip:padding-box!important;filter:drop-shadow(calc(var(--u)*2) calc(var(--u)*2) 0 rgba(0,0,0,.45))}
.topbar{padding:calc(var(--t)*4) calc(var(--t)*5) calc(var(--t)*2);gap:calc(var(--t)*5)}
.stage{padding:calc(var(--t)*3) calc(var(--t)*5) calc(var(--t)*3);gap:calc(var(--t)*5)}
.arena{gap:calc(var(--t)*5)}
.panel{padding:calc(var(--t)*8) calc(var(--t)*7) calc(var(--t)*6)}

/* #8 ปุ่มแบบเดียวทั้งเกม */
body.host .btn,body.host .btn.ghost,body.host .navbtns button{font-family:var(--pix);font-weight:normal;background:#ffd789;color:#56160c;border:var(--u) solid #5b2b2a;
  box-shadow:inset 0 var(--u) 0 #fff0ba,inset 0 calc(var(--u)*-1) 0 #e09650,0 var(--u) 0 #2b1410;padding:calc(var(--t)*3) calc(var(--t)*7);text-shadow:calc(var(--u)*2/3) calc(var(--u)*2/3) 0 #f0b46a}

/* ลูกศร pixel บนปุ่มสีเข้มฝั่งมือถือ ให้เป็นสีอ่อน */

/* รหัสห้อง: ตัว N M ของ TA 16 Bit อ่านยาก นักเรียนต้องพิมพ์ตาม เลยใช้ TA 8 Bit */
.bigcode,.roombox .code{font-family:var(--label)!important}
/* v36: ไอคอน/ตัวเลขในกล่องจับเวลาอยู่กลางกล่อง */
 
/* #10 ชื่อบนแท่นไม่โดนตัดกลางคำ */
.pod .nm{overflow-wrap:normal;white-space:nowrap;font-size:calc(var(--t)*32/3)}
.pod{width:auto;min-width:calc(var(--vw) * 16)}

/* #11 การ์ดย่อยแบบแถวร้านค้า: ขอบบาง มุมบาก ไฮไลต์ด้านใน */
.panel .need,.legend-list div,.chip,.namecloud span,.netchip{background:#ffd284!important;border:var(--u) solid #853605!important;
  box-shadow:inset 0 0 0 var(--u) #ffe5ba!important;
  clip-path:polygon(var(--u) 0,calc(100% - var(--u)) 0,calc(100% - var(--u)) var(--u),100% var(--u),100% calc(100% - var(--u)),calc(100% - var(--u)) calc(100% - var(--u)),calc(100% - var(--u)) 100%,var(--u) 100%,var(--u) calc(100% - var(--u)),0 calc(100% - var(--u)),0 var(--u),var(--u) var(--u))}
.namecloud span.arm{background:var(--bad)!important;color:#fff}

/* #12 หัวกล่องเป็นแท็บกระดาษเกาะขอบบน */
.panel{overflow:visible}
.panel .kicker{align-self:center;display:inline-block;margin-top:calc(var(--t)*-18);font-family:var(--pix);font-weight:normal;font-size:calc(var(--t)*8);color:#56160c;
  background:#ffd284;border:var(--u) solid #8f451e;box-shadow:inset 0 var(--u) 0 #fff0ba,inset 0 calc(var(--u)*-1) 0 #e4ae6e;padding:var(--t) calc(var(--t)*7);text-shadow:calc(var(--u)*2/3) calc(var(--u)*2/3) 0 #e09650}

/* #13 กล่องโค้ด: พื้นมืด + VT323 (บรรทัดไทยใช้ TA 8 Bit) */
.codebox pre{font-family:'VT323','TA8code',monospace;font-size:calc(var(--t)*9);line-height:1.1}
.codebox .cap{font-family:var(--pix);font-weight:normal}

/* #14 สีทีมเป็นจุดเน้นบนกระดาษ */
.lane.rest .lane-head .name,.lane.gql .lane-head .name{background:#ffd284;box-shadow:0 0 0 var(--u) #2b1410,inset 0 var(--u) 0 #fff0ba;text-shadow:calc(var(--u)*2/3) calc(var(--u)*2/3) 0 #e09650}
.lane.rest .lane-head .name{color:#c0321f} .lane.gql .lane-head .name{color:#7a2fa0}
.verdict{background:#ffd284!important;color:#56160c!important;border:var(--u) solid #853605!important;border-left:calc(var(--u)*6) solid var(--c)!important;box-shadow:none!important;text-shadow:calc(var(--u)*2/3) calc(var(--u)*2/3) 0 #e09650}
.verdict.gql{--c:#8a3fb0} .verdict.rest{--c:#d63c2a} .verdict.tie{--c:#c98a12} .verdict small{color:#853605}

/* #15 รวม progress + จำนวนคน + รหัสห้อง เป็นป้ายเดียว */

.sign{background:repeating-linear-gradient(0deg,#f7c77a 0 calc(var(--t)*11),#e3a256 calc(var(--t)*11) calc(var(--t)*12));padding:calc(var(--t)*5) calc(var(--t)*16)}
.sign h1{font-size:calc(var(--t)*16);color:#56160c;margin:0;white-space:nowrap;font-weight:normal}
#ovBoard .lobby{background:none!important;box-shadow:none!important;padding:0!important;width:auto!important;height:auto!important;border:0!important;border-image:none!important;filter:none!important}
#ovLobby .lobby{background:none!important;box-shadow:none!important;padding:0!important;gap:calc(var(--t)*14)!important;width:auto!important;height:auto!important;
  grid-template-columns:auto calc(var(--t)*300)!important;align-items:stretch!important;border:0!important;border-image:none!important;filter:none!important}

/* 16:9 stage: กล่องเกมอยู่กลางหน้าต่าง พื้นหลังฉากอยู่ที่ html เลยเต็มหน้าต่างเสมอ */
html{background:var(--night) var(--bg-spring) center/cover no-repeat fixed}

html body.host{background:none!important;width:calc(var(--vw) * 100);margin:var(--sy,0px) auto 0}
/* #17 แถบคีย์ลัด: ซ่อนไว้ กด H เพื่อดู */
.footer{position:relative}
body.host:not(.show-keys) .footer .keys{visibility:hidden}

  color:#56160c;background:#ffd284;border:var(--u) solid #853605;padding:calc(var(--t)*1) calc(var(--t)*4);text-shadow:none}

/* ===== v39 DECLUTTER: ตัดข้อความซ้ำ / ย้ายโน้ตผู้นำเสนอไปไว้หลังปุ่ม H ===== */

body.host .crown{padding:calc(var(--t)*2) calc(var(--t)*3)}
body.host .crown .pxi{width:calc(var(--t)*16);height:calc(var(--t)*16);vertical-align:calc(var(--t)*-4)}

body.host .lobby .count .pxi{width:calc(var(--t)*16);height:calc(var(--t)*16);vertical-align:calc(var(--t)*-4)}
/* โน้ตของผู้นำเสนอ: ซ่อนไว้ กด H แล้วโผล่พร้อมแถบปุ่มลัด */
 /* v49: คำอธิบายโชว์ตลอด ไม่ต้องกด H */

/* =====================================================================
   v40 (index_40): แก้ตามรีวิว UX/UI ข้อ 1-27
   --t = หน่วยตัวหนังสือตามสัดส่วนจอจริง (1920 = 3px, 1024 = 1.6px)
   --u = หน่วยเส้นกรอบ ยังปัดเป็นจำนวนเต็มให้พิกเซลคม
   ===================================================================== */
:root{--t:3px}

/* #2 นาฬิกานับถอยหลังใน HUD ขวาบน (แบบนาฬิกา Stardew) + คำถามบนสุดของแผง */
.hud .clock{display:flex;flex-direction:column;gap:calc(var(--t)*1.5);min-width:calc(var(--t)*64)}
.clock .cl-row{display:flex;align-items:center;gap:calc(var(--t)*3)}
body.host .clock .pxi{width:calc(var(--t)*12);height:calc(var(--t)*12);vertical-align:0}
.clock b{font-family:'PixDigits','TA 16 Bit',sans-serif;font-weight:normal;font-size:calc(var(--t)*16);line-height:1;color:#56160c;text-shadow:var(--u) 0 0 #56160c}
.clock .cl-u{font-family:var(--label);font-size:calc(var(--t)*8);color:#853605}
.clock .cl-bar{height:calc(var(--t)*4);background:#c47a3c;border:var(--u) solid #5b2b2a}
.clock .cl-bar i{display:block;height:100%;width:100%;background:#3f9b3a;transition:width 1s linear}
.clock.low .cl-bar i{background:#d63c2a} .clock.low b{color:#c0321f;text-shadow:var(--u) 0 0 #c0321f}
.clock .cl-ans{font-family:var(--label);font-size:calc(var(--t)*8);color:var(--ink)}
.panel .ask{display:flex;flex-direction:column;gap:calc(var(--t)*1);background:#ffc53d;border:var(--u) solid #853605;box-shadow:inset 0 var(--u) 0 #fff3d1;padding:calc(var(--t)*3) calc(var(--t)*5)}
.panel .ask small{font-family:var(--label);font-size:calc(var(--t)*8);color:#853605}
.panel .ask b{font-family:var(--pix);font-weight:normal;font-size:calc(var(--t)*14);line-height:1.2;color:#56160c;text-shadow:calc(var(--u)*2/3) calc(var(--u)*2/3) 0 #e09650}

body.host:not(.show-keys) .panel .ask .note{display:none}

/* #3 ขนาดตัวหนังสือขั้นต่ำสำหรับหลังห้อง */

/* #4 #5 #6 แถบหัวเลน: ตัวเลขชิดขวา ความกว้างล็อก ป้ายโชว์ตลอด ช่วงทายซ่อน */

.namecloud span.empty{background:none!important;border:0!important;box-shadow:none!important;clip-path:none!important;color:var(--muted);font-family:var(--label);cursor:default}

/* #13 มือถือ: คำถามเป็นหัวข้อใหญ่ + แถบเวลา */

/* #17 ปุ่มล้างเกมเป็นของผู้นำเสนอ ซ่อนหลังปุ่ม H */

/* #19 #20 ปุ่มและกรอบชุดเดียวกับจอ host (หน้าแรก + มือถือ) */
.landing .btn,body.player .btn{font-family:var(--pix);font-weight:normal;background:#ffd789;color:#56160c;border:3px solid #5b2b2a;box-shadow:inset 0 3px 0 #fff0ba,inset 0 -3px 0 #e09650,0 3px 0 #2b1410;text-shadow:2px 2px 0 #f0b46a}

/* #25 หน้าสรุป: ข้อสรุปว่าเลือกอะไรเมื่อไหร่ */

/* v40 เก็บงาน: สองเลนสูงเท่ากันเสมอ / เส้นคั่น HUD ตอนนาฬิกาซ่อน / แผนที่กิลด์พอดีกล่อง / กล่องสรุปชิดบน */

.clock.closed b{font-family:var(--pix);font-size:calc(var(--t)*11);text-shadow:none}

/* ===== v41: แก้ตาม playtest (ข้อ 1-11) ===== */
/* ข้อ 1: คำใบ้เป็นแถบเหลือง ไม่ถูกซ่อน */
body.host .codebox .note.hintline{background:#ffe066;color:#3b1d10;font-weight:600}
/* ข้อ 3: pop up อ่านโจทย์ */
.readpop{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(20,10,30,.62);backdrop-filter:grayscale(1) blur(1px)}

<script>
'use strict';
/* =====================================================================
   กิลด์นักผจญภัย: REST vs GraphQL
   ---------------------------------------------------------------------
   ตั้งค่าตรงนี้ก่อนใช้จริง (ดูวิธีใน README ที่ส่งมาด้วย)
   - SUPABASE_URL / SUPABASE_ANON_KEY : จาก Supabase > Project Settings > API
     ถ้าเว้นว่าง จะเข้า "โหมดซ้อม" เล่นกับบอทในเครื่องเดียว
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://ergybklrpihqvomfwbkf.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_235s9JCixxA1OVtcn0UE6g_M19S0aD1',
  PREDICT_SECONDS: 12,          // เวลาให้คนในห้องทาย (วินาที)
  SCORE_BASE: 700,              // ทายถูกได้เท่านี้
  SCORE_BONUS: 300,             // โบนัสตอบไวสูงสุด
  REHEARSAL_BOTS: 12,           // จำนวนบอทในโหมดซ้อม
  MAX_PLAYERS: 80,              // รับคนเข้าห้องได้สูงสุดกี่คน (กันคนสแปมชื่อ)
  ORDER_PAUSE_MS: 3500,         // หยุดภาพตอนทั้งสองฝั่งถึงเคาน์เตอร์ ให้อ่านบอลลูนคำสั่งทัน (เวลาในเกมหยุดด้วย)
  PHONE_TOAST_MS: 6000,         // มือถือ: แจ้งเตือนผลค้างกี่ ms ก่อนหาย (แตะแจ้งเตือน = หยุดนับ)

/* ฤดูของฉากตามช่วงของเกม (ให้ตรงกับสไลด์: เปิดเรื่อง = ใบไม้ผลิ, เดโม = ร้อน/ใบไม้ร่วง, สรุป = หนาว) */
const QUEST_SEASON = ['summer', 'summer', 'fall'];
function seasonFor(t, q) {
  if (t === 'quest' || t === 'race') return QUEST_SEASON[q] || 'summer';
  if (t === 'podium') return 'winter';
  return 'spring';
}
function setSeason(s) { if (document.documentElement.dataset.season !== s) document.documentElement.dataset.season = s; }
/* id สาธารณะ: เอา id ลับของผู้เล่นมาแฮชก่อนประกาศให้ทุกเครื่องเห็น คนอื่นเลยเอาไปส่งคำตอบแทนไม่ได้ */
function pubId(pid) {
  let a = 0x811c9dc5, b = 0x9747b28c;
  for (let i = 0; i < pid.length; i++) { const c = pid.charCodeAt(i); a = Math.imul(a ^ c, 16777619); b = Math.imul(b ^ c, 2246822507); b ^= b >>> 13; }
  return (a >>> 0).toString(36) + (b >>> 0).toString(36);
}

let SPRQ = null;
function drawHero(ctx, x, y, o) {
  const [X, Y0] = wpx(ctx, x, y);
  const f = o.facing || 1, now = o.now || performance.now();
  const hop = o.hop ? Math.round(o.hop / 3) : 0, Y = Y0 - hop;
  const SS = SIDE_SPR[o.type === 'gql' ? 'gql' : 'rest'];
  if (!(SS.img.complete && SS.img.naturalWidth > 0 && SPRQ)) return; // รูปยังโหลดไม่เสร็จ: ข้ามเฟรมนี้
  const bh = SS.H, back = 5, front = 7;
  ctx.save();
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  pxRect(ctx, X - 4, Y0, 9, 1, 'rgba(40,25,10,.35)'); pxRect(ctx, X - 3, Y0 + 1, 7, 1, 'rgba(40,25,10,.2)');
  const heavy = o.carry === 'sack' && o.kb >= 50;
  // กองแฟ้มเอกสารบนหลัง (อยู่หลังตัว) สูงตามขนาดข้อมูล
  if (o.carry === 'sack') {
    const R = Math.max(2, Math.round(sackR(o.kb || 1) / 4)), W = 7, hS = Math.max(3, Math.round(R * 2.3));
    const x0 = f > 0 ? X - back - W + 1 : X + back, yb = Y - Math.round(bh * .2);
    const FOLD = ['#d9a066', '#7fa7d6', '#c95a4a', '#8fbf6a'];
    for (let r = 0; r < hS; r++) {
      const yy = yb - r, shift = (r % 5 === 2) ? f : 0;
      const col = r % 3 === 1 ? FOLD[Math.floor(r / 3) % FOLD.length] : (r % 2 ? '#f3e7cc' : '#fffaf0');
      pxRect(ctx, x0 + shift, yy, W, 1, col);
      pxRect(ctx, x0 + shift - 1, yy, 1, 1, '#5b3b25'); pxRect(ctx, x0 + shift + W, yy, 1, 1, '#5b3b25');
    }
    pxRect(ctx, x0 - 1, yb - hS, W + 2, 1, '#5b3b25'); pxRect(ctx, x0 - 1, yb + 1, W + 2, 1, '#5b3b25');
    if (hS >= 8) pxRect(ctx, x0, yb - Math.round(hS / 2), W, 1, '#8a5a34'); // เชือกมัด
  }
  const [fi, up] = o.moving ? KANA_WALK[Math.floor(now / 150) % 4] : [0, 0];
  SPRQ.push({ S: SS, X, Y, f, fi, up, a: ctx.globalAlpha });
  const hy = Y - Math.round(bh * .5); // ระดับมือ
  if (o.carry === 'scroll') { const sx = X + f * front; pxRect(ctx, sx - 1, hy, 3, 5, '#fff1c9'); pxRect(ctx, sx - 2, hy - 1, 5, 1, '#c9a36b'); pxRect(ctx, sx - 2, hy + 5, 5, 1, '#c9a36b'); }
  if (o.carry === 'pouch') { const sx = X + f * (front - 1); pxRect(ctx, sx - 2, hy + 1, 5, 6, '#5b3b25'); pxRect(ctx, sx - 1, hy + 2, 3, 4, '#fffaf0'); pxRect(ctx, sx - 1, hy + 3, 3, 1, '#7fa7d6'); } // การ์ดข้อมูลใบเดียว
  if (heavy) { const d = Math.floor(now / 90) % 6; pxRect(ctx, X + f * front, Y - bh + 3 + d, 1, 2, '#6cc3ff'); }
  ctx.restore();
}

class LaneView {
  constructor(root, side) {
    this.root = root; this.side = side; this.canvas = root.querySelector('canvas'); this.ctx = this.canvas.getContext('2d');
    this.chipsEl = root.querySelector('.chips'); this.chips = {};
    this.scene = { counters: ['/api'] }; this.season = 'spring';
    this.data = null;
    const rnd = seeded(side === 'rest' ? 3 : 5);
    for (let i = 0; i < 840; i++) rnd(); // ข้ามลำดับสุ่มของฉากแบบเก่าที่ตัดไปแล้ว หญ้ากับละอองเลยอยู่ตำแหน่งเดิม
    this.fx = Array.from({ length: 26 }, () => ({ x: rnd(), y: rnd(), v: .3 + rnd() * .7, k: rnd() }));
    this.hTufts = Array.from({ length: 700 }, () => ({ x: Math.floor(rnd() * 1500) - 220, y: 174 + Math.floor(rnd() * 84), k: rnd() }));
    this.resize();
    try { new ResizeObserver(() => this.resize()).observe(this.canvas); } catch (e) { window.addEventListener('resize', () => this.resize()); }
  }
  resize() {
    // 1 พิกเซลฉาก = 1 พิกเซลตัวละคร, ขยายเป็นจำนวนเต็มเท่าถ้าจอพอ ไม่พอค่อยย่อแบบเกลี่ย
    // v40: ขยายเต็มกล่อง (ไม่ปัดลงเป็นจำนวนเต็ม) และยอมตัดท้องฟ้าบนสุด HI_CUT พิกเซล
    const r = this.canvas.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    const cw = Math.max(2, Math.round(r.width * dpr)), ch = Math.max(2, Math.round(r.height * dpr));
    if (this.canvas.width !== cw) this.canvas.width = cw;
    if (this.canvas.height !== ch) this.canvas.height = ch;
    const k = Math.min(cw / HI.WW, ch / (HI.WH - HI_CUT)); let bw, bh;
    if (k >= 1) { bw = Math.ceil(cw / k); bh = Math.ceil(ch / k); this.k = k; this.smooth = false; }
    else { if (cw / ch >= HI.WW / HI.WH) { bh = HI.WH; bw = Math.round(HI.WH * cw / ch); } else { bw = HI.WW; bh = Math.round(HI.WW * ch / cw); } this.k = cw / bw; this.smooth = true; }
    if (!this.buf) { this.buf = document.createElement('canvas'); this.bctx = this.buf.getContext('2d'); }
    if (this.buf.width !== bw) this.buf.width = bw;
    if (this.buf.height !== bh) this.buf.height = bh;
    this.ox = Math.floor((bw - HI.WW) / 2); this.oy = bh - HI.WH;
  }
  setScene(sc) { this.scene = sc; }
  setSeason(s) { this.season = SEASON_SCENE[s] ? s : 'summer'; }
  setData(d) { this.data = d; }
  setMetrics() {
    this.chipsEl.textContent = ''; this.chips = {};
    const defs = [['time', '⏱', 'เวลา'], ['req', '📨', 'คำขอ'], ['kb', '📦', 'ข้อมูล'], ['db', '🗄', 'เข้าคลัง']];
    for (const [key, ic, lb] of defs) {
      const c = h('span', 'chip'); c.append(h('i', null, ic), h('b', null, '-'), h('small', null, lb));
      c.dataset.k = key; this.chipsEl.append(c); this.chips[key] = { b: c.querySelector('b'), v: '-' };
    }
  }
  // v40: ค่าสุดท้ายของแต่ละช่อง (ไว้ล็อกความกว้างช่อง ตัวเลขจะได้ไม่ดันช่องข้างๆ)
  finalChips() {
    const d = this.data; if (!d) return {};
    const tt = tlTotals(d); return { time: fmtMs(d.end), req: String(tt.req), kb: fmtKB(tt.kb), db: tt.db + ' ครั้ง' };
  }
  setChip(key, v) { const c = this.chips[key]; if (c && c.v !== v) { c.v = v; numUnit(c.b, v); } }

  updateMetrics(t) {
    const d = this.data;
    if (!d || t == null || t < 0) { for (const k in this.chips) this.setChip(k, '-'); return; }
    let req = 0, kb = 0, db = 0;
    for (const e of d.events) { if (e.t > t) break; if (e.k === 'req') req++; else if (e.k === 'kb') kb += e.v; else db++; }
    this.setChip('time', fmtMs(Math.min(t, d.end)));
    this.setChip('req', String(req));
    this.setChip('kb', kb ? fmtKB(kb) : '0 KB');
    this.setChip('db', db + ' ครั้ง');
  }

  draw(now, t) { this.drawHi(now, t != null && this.frozen ? t - 1e-6 : t); } // v59: หยุดรอพนักงาน = ภาพค้างที่ก่อนออกจากเคาน์เตอร์

  drawWorld(ctx, now, t) {
    const side = this.side, P = PAL[side], d = this.data;
    // ป้ายบนพื้น
    pill(ctx, 520, 300, 'Network', { font: FONT(600, 25), h: 36 });
    pill(ctx, 125, 300, 'Client', { font: FONT(600, 25), h: 36 });
    pill(ctx, GEO.dbX - 30, 300, 'Database', { font: FONT(600, 25), h: 36 });
    deferText(ctx, c => { c.fillStyle = '#ffe7b0'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = FONT(600, 22); c.fillText('กิลด์', 880, 69); c.font = FONT(600, 17); c.fillText('Server', 880, 90); }); // บนป้ายกิลด์
    this.drawCountersHi(ctx, now, t);
    if (d) this.drawTrips(ctx, now, t);
    else {
      drawHero(ctx, GEO.campX, GEO.roadY, { type: side, facing: -1, now }); this.drawVillager(ctx, now, -1, null);
      deferText(ctx, c => talkBubble(c, 118, 140, 'dots', false, now)); // v49: ระหว่างรอแข่ง client กำลังเล่าว่าอยากได้อะไร
    } // v44: ยังไม่แข่ง หันซ้ายฟังคำขอ client
    // เส้นชัย
    const endT = d ? d.end : null;
    if (d && t != null && t >= endT) {
      const val = d.end;
      const age = clamp((t - endT) / (endT * .08 + 1), 0, 1);
      ctx.save(); ctx.translate(GEO.campX + 30, 128); const s = .6 + .4 * easeIO(age); ctx.scale(s, s);
      pill(ctx, 0, 0, fmtMs(val), { font: LABELF(400, 30), bg: P.main, color: '#fff', h: 46, padX: 18, stroke: '#2b1410' });
      ctx.restore();
    }
  }

  drawTrips(ctx, now, t) {
    const d = this.data, side = this.side;
    const tt = t == null ? -1 : t;
    // พนักงานเดินไปคลังเอกสาร (1 คน = เข้าคลัง 1 ครั้ง)
    this.drawClerks(ctx, now, tt, d);
    let dbn = 0; for (const e of d.events) { if (e.t > tt) break; if (e.k === 'db') dbn++; }
    if (dbn >= 20) {
      const pulse = 1 + .06 * Math.sin(now * .02);

        const rx = lerp(seg.x0, seg.x1, u);
        list.push({ x: rx, y: GEO.roadY + r.yOff, type: r.type, facing: seg.x1 < seg.x0 ? -1 : 1, moving: seg.x0 !== seg.x1 && !this.frozen, carry: seg.carry, kb: seg.kb, now });

      } else if (tt >= last) {
        const a = 1 - clamp((tt - last) / (d.end * .06 + 1), 0, 1);
        if (a > 0) list.push({ x: GEO.campX + 30, y: GEO.roadY + rs[0].yOff, type: side, facing: -1, moving: false, alpha: a, now });
      }
    }
    list.sort((a, b) => a.y - b.y).forEach(o => drawHero(ctx, o.x, o.y, o));
    this.drawVillager(ctx, now, tt, d);
    // ลูกโป่งคำพูด 2 บรรทัด (ภาษาคน / คำสั่งจริง): โผล่ตอนถึงหน้าเคาน์เตอร์ ปักไว้ที่เคาน์เตอร์
    // ค้างอย่างน้อย bubbleMin (2.5 วิบนจอ) หรือจนกว่าคำสั่งถัดไปในเลนเดียวกันจะโผล่

    bl.forEach(({ b, seg }, i) => {
      const tA = seg.t0, next = bl[i + 1] ? bl[i + 1].seg.t0 : Infinity;
      const fT = this.fadeT || 0, tE = Math.min(Math.max(seg.t1 + fT, tA + (this.bubbleMin || 0)), next); // ไม่จางระหว่างยังยืนสั่งอยู่
      if (tt < tA || tt >= tE) return;
      const fade = next <= tE || !fT ? 1 : clamp((tE - tt) / fT, 0, 1), sx = seg.x0, y = GEO.roadY - 166;
      const [top] = Array.isArray(b.text) ? b.text : [b.text]; // v40: โชว์แค่บรรทัดภาษาคน (โค้ดมีในแผงซ้ายแล้ว)
      deferText(ctx, c => {
        c.save(); c.globalAlpha *= fade;
        c.font = FONT(600, 30);
        const w = c.measureText(top).width + 32, hh = 50, y0 = y - hh / 2;
        const x = clamp(sx, w / 2 + 10, 790 - w / 2); // v35: ไม่ให้ทับป้ายกิลด์
        c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(x - w / 2 + 3, y0 + 3, w, hh);
        c.fillStyle = '#ffe4b3'; rr(c, x - w / 2, y0, w, hh); c.fill();
        c.strokeStyle = PAL[side].main; c.lineWidth = 3.5; c.stroke();
        { // v46: หางบอลลูนชี้ลงไปที่หัวตัวละครที่พูด
          const tipY = Math.max(y0 + hh + 12, GEO.roadY - 124), bx = clamp(sx - 10, x - w / 2 + 16, x + w / 2 - 16);
          c.beginPath(); c.moveTo(bx - 9, y0 + hh - 2); c.lineTo(sx, tipY); c.lineTo(bx + 9, y0 + hh - 2); c.closePath(); c.fillStyle = '#ffe4b3'; c.fill();
          c.beginPath(); c.moveTo(bx - 9, y0 + hh); c.lineTo(sx, tipY); c.lineTo(bx + 9, y0 + hh); c.strokeStyle = PAL[side].main; c.lineWidth = 3.5; c.stroke();
        }
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillStyle = '#3a1e17'; c.font = FONT(600, 30); c.fillText(top, x, y + 1);
        c.restore();
      });
    });
  }

  /* ชาวบ้าน = Client: ขอของ > รอ > หงุดหงิดถ้านาน > ได้ของ ✓ (เวลาบนจอคิดจาก rscale) */
  drawVillager(ctx, now, tt, d) {
    const S = VILL_SPR, X0 = 118;
    const pre = d && tt < 0 ? -tt * (this.rscale || 1) : -1; // v49: เวลาจริง (ms) ก่อนออกเดิน
    const waitMs = d && tt >= 0 ? Math.min(tt, d.end) * (this.rscale || 1) : -1;
    const done = d && tt >= d.end;
    if (S.img.complete && S.img.naturalWidth > 0 && SPRQ) {
      const [X, Y] = wpx(ctx, X0, GEO.roadY - 6);
      const up = done ? Math.round(Math.abs(Math.sin(now * .012)) * 6) : 0;
      SPRQ.push({ S, X, Y, f: 1, fi: 0, up, a: ctx.globalAlpha });
    }
    if (pre > 0) { if (pre > PRE_TALK_MS / 2) deferText(ctx, c => talkBubble(c, X0, 140, 'dots')); else deferText(ctx, c => talkBubble(c, GEO.campX + 4, 140, 'check')); } // v49: client ขอ > ปาร์ตี้รับทราบ
    if (done) { deferText(ctx, c => iconBubble(c, 'check', X0, 84)); return; }
    if (waitMs < 0) return;
    deferText(ctx, c => iconBubble(c, waitMs < 3600 ? 'hourglass' : 'anger', X0, 104));
  }

/* =====================================================================
   TRANSPORT: Supabase Realtime (ของจริง) หรือ BroadcastChannel (โหมดซ้อม)
   host  : ฟัง channel "…-inbox"  /  ส่งสถานะเกมทาง "…-state"
   player: ฟัง "…-state"          /  ส่งคำตอบเข้า "…-inbox" ผ่าน HTTP (ไม่ต้อง subscribe
           เลยไม่มีใครได้ข้อความของคนอื่น ประหยัดโควตาข้อความ)
   ===================================================================== */
const HAS_SB = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
class LocalTransport {
  constructor(room, role) {
    this.kind = 'local'; this.role = role; this.handlers = []; this.onStatus = () => { };
    try { this.bc = new BroadcastChannel('guild-' + room); } catch (e) { this.bc = null; }
    if (this.bc) this.bc.onmessage = ev => { const m = ev.data; if (!m) return; if ((role === 'host' && m.to === 'host') || (role === 'player' && m.to === 'players')) this.handlers.forEach(fn => fn(m.p)); };
    setTimeout(() => this.onStatus('local'), 0);
  }
  on(fn) { this.handlers.push(fn); }
  send(p) { if (this.bc) this.bc.postMessage({ to: this.role === 'host' ? 'players' : 'host', p }); }
}
class SbTransport {
  constructor(room, role) {
    this.kind = 'supabase'; this.role = role; this.handlers = []; this.onStatus = () => { }; this.stateReady = false;
    const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false }, realtime: { params: { eventsPerSecond: 20 } } });
    this.sb = sb;
    const inName = `guild-${room}-inbox`, stName = `guild-${room}-state`;
    const status = s => { this.onStatus(s === 'SUBSCRIBED' ? 'ok' : (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT' || s === 'CLOSED') ? 'err' : 'wait'); };
    if (role === 'host') {
      this.inbox = sb.channel(inName, { config: { broadcast: { self: false } } });
      this.inbox.on('broadcast', { event: 'm' }, ({ payload }) => this.handlers.forEach(fn => fn(payload)));
      this.inbox.subscribe(status);
      this.state = sb.channel(stName, { config: { broadcast: { self: false } } });
      this.state.subscribe(s => { this.stateReady = s === 'SUBSCRIBED'; });
    } else {
      this.state = sb.channel(stName, { config: { broadcast: { self: false } } });
      this.state.on('broadcast', { event: 's' }, ({ payload }) => this.handlers.forEach(fn => fn(payload)));
      this.state.subscribe(status);
      this.inbox = sb.channel(inName);
    }
  }
  on(fn) { this.handlers.push(fn); }
  async send(p) {
    try {
      if (this.role === 'host') { if (this.stateReady) await this.state.send({ type: 'broadcast', event: 's', payload: p }); }
      else if (typeof this.inbox.httpSend === 'function') await this.inbox.httpSend('m', p);
      else await this.inbox.send({ type: 'broadcast', event: 'm', payload: p });
    } catch (e) { console.warn('send failed', e); }
  }
}
function makeTransport(room, role) {
  if (HAS_SB && window.supabase && window.supabase.createClient) return new SbTransport(room, role);
  return new LocalTransport(room, role);
}
function joinUrl(room) { return location.origin + location.pathname + '?room=' + encodeURIComponent(room); }

  el.append(h('div', 'joinurl', text));
}

    c.append(h('div', 'p-big', '⚔️'), h('h2', null, 'ตั้งชื่อนักผจญภัย'), h('p', null, 'ชื่อนี้จะขึ้นบนจอใหญ่และกระดานคะแนน'));
    const inp = h('input', 'p-input'); inp.maxLength = 48; inp.placeholder = 'เช่น อัศวินนอนดึก'; inp.autocomplete = 'off';
    const go = h('button', 'btn p-go', 'เข้ากิลด์ →');
    const submit = () => { const nm = cleanName(inp.value); if (!nm) { inp.focus(); return; } this.name = nm; this.save(); this.lastJoin = Date.now(); this.send({ k: 'join' }); this.viewKey = ''; this.render(); };
    go.onclick = submit; inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
    c.append(inp, go); M.append(c);
    setTimeout(() => inp.focus(), 50);
  },
  build(M, s, my, openNow) {
    M.textContent = ''; M.classList.remove('lesson-on', 'lesson-center'); M.style.paddingTop = '';
    const card = (big, title, text, cls) => { const c = h('div', 'p-card' + (cls ? ' ' + cls : '')); if (big) c.append(h('div', 'p-big', big)); if (title) c.append(hn('h2', null, title)); if (text) c.append(hn('p', null, text)); M.append(c); return c; };
    if (this.kicked()) { card('🙈', 'ถูกเชิญออก{จากห้องแล้ว}', 'ผู้นำเสนอนำชื่อนี้ออกจากเกม'); return; }
    if (!this.joined() && s.t === 'lobby') { card('📨', 'กำลังส่งชื่อเข้ากิลด์…', 'รอสักครู่'); return; }
    if (s.t === 'lobby') { const c = card('✅', 'เข้ากิลด์แล้ว!', 'รอผู้นำเสนอเริ่มภารกิจแรก ดูชื่อตัวเองบนจอใหญ่ได้เลย'); c.append(hn('p', 'p-rule', `{ทายถูกได้ ${CONFIG.SCORE_BASE}} {ตอบไวได้โบนัสเพิ่มสูงสุด ${CONFIG.SCORE_BONUS}}`), hn('p', 'p-rule', 'กด {?} ดูวิธีอ่านฉาก')); return; }
    if (s.t === 'legend') { const c = card(null, 'ส่วนประกอบฉาก', 'ดูบนจอใหญ่ไปพร้อมกัน'); const L = h('div', 'p-legend'); SCENE_ROWS.forEach(([ic, b, t]) => { const r = h('div', 'row'); const tx = h('span'); tx.append(h('b', null, b), document.createTextNode(t)); r.append(h('span', null, ic), tx); L.append(r); }); c.append(L); return; } // v44
    if (s.t === 'quest') {
      const mine = this.myAns[s.q];
      if (s.reading) { this.buildReading(M, s); return; }
      const head = h('div', 'p-card p-head');
      if (mine || !openNow) { head.append(hn('h2', null, s.title || ''), hn('p', null, s.need || '')); M.append(head); }
      if (mine) { card(CHOICE[mine].icon, '{ล็อกคำตอบแล้ว}: {' + CHOICE[mine].label + '}', 'ดูผลการแข่งบนจอใหญ่'); return; }
      if (!openNow) { card('⌛', 'หมดเวลาทาย', 'รอบนี้ไม่ทันแล้ว รอรอบหน้านะ'); return; }
      // v40: คำถามคือหัวข้อใหญ่ มีแถบเวลา รายละเอียดโจทย์ย่อลง (จอใหญ่โชว์อยู่แล้ว)
      head.classList.add('p-ask'); head.append(hn('p', 'p-kick', s.title || ''), hn('h2', null, 'ใครจะทำภารกิจนี้{เสร็จก่อน?}'));
      if (s.net) head.append(h('span', 'p-tab net', s.net)); const tm = h('span', 'p-tab time'); tm.id = 'pTimer'; head.append(tm);
      { const bar = h('div', 'p-bar'); const f = h('i'); f.id = 'pBar'; bar.append(f); head.append(bar); } // v42: แถบเวลาหดตามเวลาที่เหลือ
      head.append(hn('p', 'p-need', s.need || '')); if (s.sides) head.append(this.sidesEl(s.sides)); M.append(head);
      const G = h('div', 'choices');
      for (const c of ['rest', 'gql', 'tie']) {
        const b = h('button', 'choice ' + c); const tx = h('span'); tx.append(document.createTextNode(CHOICE[c].label), h('small', null, CHOICE[c].sub));
        b.append(h('span', 'ic', CHOICE[c].icon), tx); b.onclick = () => this.answer(c); G.append(b);
      }
      M.append(G); return;
    }
    if (s.t === 'race') {
      const mine = this.myAns[s.q];
      if (!s.done) { card('⚔️', 'กำลังแข่ง!', 'ดูจอใหญ่เลย' + (mine ? ' · คุณทาย ' + CHOICE[mine].label : '')); return; }
      // หลัง PHONE_LESSON_DELAY_MS: ผลทายเด้งเป็นแจ้งเตือนด้านบน (syncToast) คำอธิบายอยู่กลางจอ
      if (this._lesson) { M.classList.add('lesson-on', 'lesson-center'); this.lessonCard(M, s); return; }
      const miss = !my || my[2] === -1, ok = !miss && my[2] === 1;
      if (miss) card('🙈', 'รอบนี้ไม่ได้ทาย', 'คำตอบคือ ' + CHOICE[s.correct].label + (my ? ` · รวม ${my[0].toLocaleString()} คะแนน อันดับ ${my[3]}/${s.total}` : ''));
      else {
        const c = card(ok ? '🎉' : '💥', ok ? 'ทายถูก!' : 'พลาดไปนิด', 'คำตอบคือ ' + CHOICE[s.correct].label, 'p-res ' + (ok ? 'ok' : 'bad'));
        c.append(h('div', 'p-score', ok ? '+' + my[1].toLocaleString() : '+0'), h('div', 'p-rank', `รวม ${my[0].toLocaleString()} คะแนน · อันดับ ${my[3]} / ${s.total}`));
      }
      return;
    }
    if (s.t === 'podium') {
      const c = card(my && my[3] <= 3 ? ['🥇', '🥈', '🥉'][my[3] - 1] : '🏅', my ? `คุณได้{อันดับ ${my[3]} จาก ${s.total}}` : 'จบภารกิจแล้ว!', my ? `คะแนนรวม ${my[0].toLocaleString()}` : '');
      if (s.top && s.top.length) { const l = h('div'); l.style.marginTop = '12px'; s.top.forEach((t, i) => l.append(h('p', null, ['🥇', '🥈', '🥉'][i] + ' ' + t[0] + ' · ' + Number(t[1]).toLocaleString()))); c.append(l); }
      c.append(h('p', null, 'ขอบคุณที่ร่วมผจญภัย! ⚔️'));
    }
  },
  // v55: ผลทายถูก/พลาด โชว์ PHONE_LESSON_DELAY_MS ก่อน แล้วค่อยขึ้นคำอธิบาย
  lessonOn(s) {
    if (!s.done || !Array.isArray(s.lesson)) return false;
    const k = s.s + ':' + s.q, d = CONFIG.PHONE_LESSON_DELAY_MS || 0;
    if (!this.doneAt[k]) { this.doneAt[k] = Date.now(); setTimeout(() => { this.viewKey = ''; this.render(); }, d + 30); }
    return Date.now() - this.doneAt[k] >= d;
  },
  // v56: แจ้งเตือนผลด้านบน นับถอยหลัง PHONE_TOAST_MS แตะ = หยุดนับ, X = ปิด
  syncToast(s, my) {
    const want = this._lesson && s && s.t === 'race';
    const key = s ? s.s + ':' + s.q : '';
    let T = this.toast;
    if (T && T.key !== key) { if (T.el) T.el.remove(); this.toast = T = null; }
    if (!want) { if (T && T.el) { T.el.remove(); T.el = null; } this.padToast(0); return; }
    if (!T) T = this.toast = { key, t0: Date.now(), left: null, closed: false, el: null };
    if (T.closed) return;
    const miss = !my || my[2] === -1, ok = !miss && my[2] === 1, cls = miss ? 'miss' : ok ? 'ok' : 'bad';
    const sub = 'คำตอบคือ ' + CHOICE[s.correct].label + (my ? ` · รวม ${my[0].toLocaleString()} คะแนน · อันดับ ${my[3]} / ${s.total}` : '');
    const sig = [cls, sub].join('|');
    if (T.el && T.el.isConnected && T.sig === sig) { this.padToast(T.el.offsetTop + T.el.offsetHeight); return; }
    if (T.el) T.el.remove();
    const el = h('div', 'p-toast ' + cls); el.setAttribute('role', 'status');
    const tb = h('div', 'tb'), tt = h('div', 'tt');
    tt.append(h('b', null, miss ? 'รอบนี้ไม่ได้ทาย' : ok ? 'ทายถูก!' : 'พลาดไปนิด'), h('small', null, 'คำตอบคือ ' + CHOICE[s.correct].label));
    if (my) tt.append(hn('small', null, `{รวม ${my[0].toLocaleString()} คะแนน} · {อันดับ ${my[3]} / ${s.total}}`)); // ขึ้นบรรทัดใหม่ได้ตรง · เท่านั้น
    const x = h('button', 'tx'); x.type = 'button'; x.setAttribute('aria-label', 'ปิดแจ้งเตือน');
    x.onclick = e => { e.stopPropagation(); this.closeToast(); };
    tb.append(h('span', 'ti', miss ? '🙈' : ok ? '🎉' : '💥'), tt, h('span', 'tsc', miss ? '' : ok ? '+' + my[1].toLocaleString() : '+0'), x);
    const tf = h('div', 'tf'), bar = h('div', 'bar'), fill = h('i'); bar.append(fill);
    el.append(tb, tf, bar);
    el.onclick = () => { if (T.left == null) { T.left = Math.max(0, CONFIG.PHONE_TOAST_MS - (Date.now() - T.t0)); this.drawToast(); } };
    document.body.append(el); T.el = el; T.sig = sig; T.tf = tf; T.fill = fill;
    this.drawToast();
    this.padToast(el.offsetTop + el.offsetHeight);
    if (!this._toastLoop) { const loop = () => { this._toastLoop = this.toast && this.toast.el && !this.toast.closed ? requestAnimationFrame(loop) : 0; this.drawToast(); }; this._toastLoop = requestAnimationFrame(loop); }
  },
  drawToast() {
    const T = this.toast; if (!T || !T.el || T.closed) return;
    const dur = CONFIG.PHONE_TOAST_MS || 6000, paused = T.left != null, left = paused ? T.left : dur - (Date.now() - T.t0);
    if (!paused && left <= 0) { this.closeToast(); return; }
    T.fill.style.width = Math.max(0, left / dur * 100) + '%';
    const sec = Math.ceil(left / 1000), sig = paused ? 'p' : String(sec);
    if (T.tfSig === sig) return; T.tfSig = sig; T.tf.textContent = '';
    if (paused) T.tf.append(h('span', 'stop', 'หยุดนับแล้ว'), document.createTextNode(' · กด X เพื่อปิด'));
    else T.tf.append(document.createTextNode('จะปิดใน '), h('b', null, String(sec)), document.createTextNode(' วินาที · '), h('span', 'stop', 'แตะเพื่อหยุด'));
  },
  closeToast() {
    const T = this.toast; if (!T || T.closed) return; T.closed = true;
    const el = T.el; T.el = null; this.padToast(0);
    if (el) { el.classList.add('out'); setTimeout(() => el.remove(), 280); }
  },
  // กันคำอธิบายกลางจอไม่ให้โดนแจ้งเตือนทับ: ดันลงเท่าที่ทับจริง พอแจ้งเตือนหายก็กลับมากลางจอ
  padToast(bottom) {
    const M = $('#pMain'); if (!M) return;
    if (!bottom || !M.classList.contains('lesson-center')) { M.style.paddingTop = ''; return; }
    const top = M.getBoundingClientRect().top; M.style.paddingTop = Math.max(0, Math.ceil(bottom - top + 10)) + 'px';
  },
  lessonCard(M, s) {
    const [t, body] = s.lesson, c = h('div', 'p-card p-lesson');
    c.append(h('small', 'lk', '📜 ทำไมผลออกมาแบบนี้'), h('h3', null, t), h('p', null, body));
    M.append(c);
  },
  sidesEl(sides) { const S = h('div', 'p-sides'); sides.forEach((t, i) => { const r = h('div', 'p-side ' + (i ? 'gql' : 'rest')); r.append(h('b', null, i ? 'GraphQL' : 'REST'), hn('span', null, t)); S.append(r); }); return S; },
  // v41: ช่วงอ่านโจทย์ = pop up โจทย์ใหญ่ ข้างหลังเป็นปุ่มสีเทากดไม่ได้
  buildReading(M, s) {
    const G = h('div', 'choices waiting'); for (const c of ['rest', 'gql', 'tie']) { const b = h('button', 'choice ' + c); b.disabled = true; const tx = h('span'); tx.append(document.createTextNode(CHOICE[c].label), h('small', null, CHOICE[c].sub)); b.append(h('span', 'ic', CHOICE[c].icon), tx); G.append(b); }
    M.append(G);
    const O = h('div', 'readpop'), B = h('div', 'box'), tt = h('div', 'ttl');
    tt.append(h('small', null, '📜 ภารกิจ ' + (s.q + 1)), h('b', null, s.name || ''));
    if (s.net) B.append(h('span', 'p-tab net', s.net)); B.append(tt);
    const nd = h('div', 'need'); nd.append(nwText(s.need || '')); B.append(nd);
    if (s.sides) B.append(this.sidesEl(s.sides));
    B.append(h('div', 'ft', 'รอผู้นำเสนอเปิดให้ทาย'));
    O.append(B); M.append(O);
    requestAnimationFrame(() => { const t = document.querySelector('.p-top'); if (t) O.style.top = Math.round(t.getBoundingClientRect().bottom + 6) + 'px'; });
  },
  showHelp() {
    if (document.querySelector('.p-sheet')) return;
    const O = h('div', 'p-sheet'), I = h('div', 'in'), hd = h('h3'), x = h('button', 'x', 'ปิด'); x.type = 'button';
    hd.append(document.createTextNode('อ่านฉากยังไง'), x); I.append(hd);
    const row = (ic, b, t) => { const r = h('div', 'row'); const tx = h('span'); tx.append(h('b', null, b), document.createTextNode(t)); r.append(h('span', null, ic), tx); return r; };
    I.append(h('h4', null, 'ฉากบนจอใหญ่'));
    SCENE_ROWS.forEach(r => I.append(row(...r)));
    I.append(h('h4', null, 'ตัวเลขบนเลน'));
    [['⏱', 'เวลา', 'ไป-กลับจนได้ของครบ (ms)'], ['📨', 'คำขอ', 'ยิงไปกี่คำขอ (บางคำขอไปพร้อมกันได้)'], ['📦', 'ข้อมูล', 'ขนาดที่แบกกลับมา (KB)'], ['🗄', 'เข้าคลัง', 'server ไปค้น database กี่ครั้ง']].forEach(r => I.append(row(...r)));
    I.append(h('h4', null, 'เน็ต'), row('📶', '3G / 4G / Wi-Fi', 'เน็ตยิ่งช้า ข้อมูลยิ่งใหญ่ยิ่งเสียเวลา'));
    I.append(h('h4', null, 'คะแนน'), h('div', 'score', `ทายถูกได้ ${CONFIG.SCORE_BASE} ตอบไวได้โบนัสเพิ่มสูงสุด ${CONFIG.SCORE_BONUS} · เสมอ = ต่างกันไม่ถึง 10%`));
    O.append(I); O.onclick = e => { if (e.target === O || e.target === x) O.remove(); };
    document.body.append(O);
  },
  renderTimer() {
    const el = document.getElementById('pTimer'); if (!el) return;
    const left = Math.max(0, Math.ceil((this.deadline - Date.now()) / 1000));
    el.textContent = ''; el.append(document.createTextNode('⌛ '), h('b', null, String(left))); el.classList.toggle('low', left <= 3);
    const pb = document.getElementById('pBar'); if (pb) { pb.style.width = Math.max(0, Math.min(100, (this.deadline - Date.now()) / questMs(this.state.q) * 100)) + '%'; pb.parentNode.classList.toggle('low', left <= 3); }
    if (left <= 0) { this.viewKey = ''; }
  },
};

/* =====================================================================
   LANDING + BOOT
   ===================================================================== */
const Landing = {
  init() {
    $('#landing').classList.remove('hidden');
    const go = () => { const c = $('#landCode').value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); if (c.length === 4) location.search = '?room=' + c; };
    $('#landJoin').onclick = go; $('#landCode').onkeydown = e => { if (e.key === 'Enter') go(); };
    $('#landHost').onclick = () => { location.search = '?host'; };
  },
};
function setPixelUnit() { // v35: จอ host ล็อกเป็นกล่อง 16:9 ย่อ/ขยายให้พอดีหน้าต่าง ส่วนที่เกินเป็นพื้นหลัง
  const R = document.documentElement.style, host = document.body && document.body.classList.contains('host');
  const sw = host ? Math.min(innerWidth, innerHeight * 16 / 9) : innerWidth, sh = host ? sw * 9 / 16 : innerHeight;
  if (host) { R.setProperty('--vw', sw / 100 + 'px'); R.setProperty('--vh', sh / 100 + 'px'); R.setProperty('--sy', Math.max(0, (innerHeight - sh) / 2) + 'px'); }
  else { R.removeProperty('--vw'); R.removeProperty('--vh'); R.removeProperty('--sy'); }
  R.setProperty('--u', Math.max(1, Math.floor(sw / 640)) + 'px'); R.setProperty('--t', Math.max(1, sw / 640) + 'px'); // v40: ตัวหนังสือตามสัดส่วนจริง เส้นกรอบยังเป็นจำนวนเต็ม
}
function boot() {
  setPixelUnit(); window.addEventListener('resize', setPixelUnit);
  const p = new URLSearchParams(location.search);
  if (p.has('host')) Host.init();
  else if (p.get('room')) Player.init(p.get('room').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4));
  else Landing.init();
}
Promise.race([Promise.all([window.PIX_FONTS, document.fonts ? document.fonts.ready : null]), new Promise(r => setTimeout(r, 1500))]).then(() => { startPixelIcons(); boot(); });
</script>
